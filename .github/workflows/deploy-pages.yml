name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inspect build output
        run: |
          echo "=== root ==="
          ls -la
          echo "=== output directories ==="
          find . -maxdepth 4 -type d \( -name dist -o -name output -o -name public \) -print
          echo "=== index files ==="
          find . -maxdepth 5 -type f -name 'index.html' -print
      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          if [ -d "output/public" ]; then cp -R output/public/. site/
          elif [ -d ".output/public" ]; then cp -R .output/public/. site/
          elif [ -d "dist/client" ]; then cp -R dist/client/. site/
          elif [ -d "dist" ]; then cp -R dist/. site/
          else echo "No static output directory found"; exit 1; fi
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
